name: Feature request
description: Suggest an idea or new security policy module for AgentArmor
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting a feature to make AI agents safer!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the security threat or workflow limitation.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of the heuristic, tool filter, or policy feature.
    validations:
      required: true
