<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000208" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Shield Body Gradient -->
    <linearGradient id="shieldBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <!-- AI Core Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#4338ca" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Circuit Neon Stroke -->
    <linearGradient id="circuitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="#1e293b" stroke-width="2" stroke-opacity="0.6" />

  <!-- Background Circuit Grid Lines -->
  <g stroke="#334155" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="4 6">
    <line x1="80" y1="120" x2="432" y2="120" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="392" x2="432" y2="392" />
    <line x1="140" y1="70" x2="140" y2="442" />
    <line x1="256" y1="70" x2="256" y2="442" />
    <line x1="372" y1="70" x2="372" y2="442" />
  </g>

  <!-- Outer Protective Halo Shield (Glow Layer) -->
  <path d="M 256,76
           C 340,76 414,116 414,196
           C 414,310 298,394 256,428
           C 214,394 98,310 98,196
           C 98,116 172,76 256,76 Z"
        fill="none"
        stroke="url(#shieldBorder)"
        stroke-width="14"
        stroke-opacity="0.3"
        filter="url(#neonGlow)" />

  <!-- Main Shield Body -->
  <path d="M 256,80
           C 336,80 406,118 406,196
           C 406,306 294,388 256,420
           C 218,388 106,306 106,196
           C 106,118 176,80 256,80 Z"
        fill="url(#shieldBody)"
        stroke="url(#shieldBorder)"
        stroke-width="6" />

  <!-- Inner Cyber Tech Contour Line -->
  <path d="M 256,104
           C 320,104 380,136 380,202
           C 380,292 286,362 256,390
           C 226,362 132,292 132,202
           C 132,136 192,104 256,104 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="1.8"
        stroke-opacity="0.4"
        stroke-dasharray="8 4" />

  <!-- Neural Cyber Node Network Tracks Inside Shield -->
  <g stroke="url(#circuitCyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <!-- Top Left to Center Core -->
    <path d="M 170,165 L 210,165 L 235,210" fill="none" />
    <!-- Top Right to Center Core -->
    <path d="M 342,165 L 302,165 L 277,210" fill="none" />
    <!-- Bottom Left to Core -->
    <path d="M 185,305 L 215,285 L 235,265" fill="none" />
    <!-- Bottom Right to Core -->
    <path d="M 327,305 L 297,285 L 277,265" fill="none" />
    <!-- Bottom Shield Anchor Trace -->
    <path d="M 256,365 L 256,305" fill="none" />
  </g>

  <!-- Circuit Network Junction Points (Nodes) -->
  <g fill="#38bdf8">
    <circle cx="170" cy="165" r="4.5" filter="url(#neonGlow)" />
    <circle cx="342" cy="165" r="4.5" filter="url(#neonGlow)" />
    <circle cx="185" cy="305" r="4.5" filter="url(#neonGlow)" />
    <circle cx="327" cy="305" r="4.5" filter="url(#neonGlow)" />
    <circle cx="256" cy="365" r="4" filter="url(#neonGlow)" />
  </g>

  <!-- AI Sentinel Core Halo Glow -->
  <circle cx="256" cy="238" r="54" fill="url(#coreGlow)" filter="url(#intenseGlow)" />

  <!-- Central Hexagonal Neural Cyber Vault (AI Guardian Core) -->
  <polygon points="256,198 292,218 292,258 256,278 220,258 220,218"
           fill="#090d16"
           stroke="url(#shieldBorder)"
           stroke-width="3.5"
           filter="url(#neonGlow)" />

  <!-- Inner Concentric AI Synapse Node -->
  <polygon points="256,212 278,225 278,251 256,264 234,251 234,225"
           fill="none"
           stroke="#38bdf8"
           stroke-width="1.8"
           stroke-opacity="0.8" />

  <!-- Glowing Quantum AI Spark In Center -->
  <circle cx="256" cy="238" r="6" fill="#ffffff" filter="url(#neonGlow)" />
  <circle cx="256" cy="238" r="3" fill="#38bdf8" />

  <!-- Lock Horizon Zero-Trust Shackle Motif on Crest -->
  <path d="M 240,136
           C 240,126 247,118 256,118
           C 265,118 272,126 272,136
           L 272,146 L 240,146 Z"
        fill="none"
        stroke="#38bdf8"
        stroke-width="3"
        stroke-linecap="round" />
</svg>
